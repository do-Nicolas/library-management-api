services:
  db:
    image: postgres:17
    container_name: biblioteca-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - biblioteca-data:/var/lib/postgresql/data

volumes:
  biblioteca-data: